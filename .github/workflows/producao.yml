# Publica o site em produção (www.artvisao.pt) por FTP, a partir da pasta artvisao/.
#
# Só corre quando se pede (Actions → «Publicar em produção» → Run workflow):
# - «testar ligação» entra no servidor e mostra as pastas, sem enviar nada — serve para
#   confirmar os dados do FTP e descobrir a pasta do site (FTP_DIR);
# - «publicar» envia a cópia do site, com a galeria do Instagram já preenchida.
#
# Ao contrário da cópia de teste do GitHub Pages, esta leva o formulário de contacto (o
# contact.php corre no PHP do alojamento) e pode ser indexada.
#
# Secrets: FTP_SERVER, FTP_USERNAME e FTP_PASSWORD. Variável: FTP_DIR, a pasta do site no
# servidor (por exemplo public_html). No servidor não se apaga nada, exceto as imagens de
# publicações do Instagram que saíram da galeria.
name: Publicar em produção

on:
  workflow_dispatch:
    inputs:
      modo:
        description: O que fazer
        type: choice
        options:
          - testar ligação
          - publicar
        default: testar ligação

permissions:
  contents: read

# Nunca duas publicações em simultâneo no mesmo servidor
concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  producao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar os dados do FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
          MODO: ${{ inputs.modo }}
        run: |
          [ -n "$FTP_SERVER" ] || { echo "::error::falta o secret FTP_SERVER"; exit 1; }
          [ -n "$FTP_USERNAME" ] || { echo "::error::falta o secret FTP_USERNAME"; exit 1; }
          [ -n "$FTP_PASSWORD" ] || { echo "::error::falta o secret FTP_PASSWORD"; exit 1; }
          if [ "$MODO" = publicar ] && [ -z "$FTP_DIR" ]; then
            echo "::error::falta a variável FTP_DIR (a pasta do site no servidor). Corre primeiro «testar ligação» para a encontrar."
            exit 1
          fi

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # A ligação é sempre cifrada (FTPS): sem TLS o lftp recusa-se a enviar a password.
      # O certificado não é validado porque muitos alojamentos o emitem para o nome do
      # servidor e não para o endereço usado na ligação; a cifra mantém-se. A password vai
      # pela variável LFTP_PASSWORD, nunca para o ficheiro nem para a linha de comandos.
      - name: Preparar a ligação
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          cat > "$RUNNER_TEMP/ligar.lftp" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set net:reconnect-interval-base 5
          open --env-password -u "$FTP_USERNAME" "$FTP_SERVER"
          EOF

      - name: Testar a ligação e mostrar as pastas
        if: inputs.modo == 'testar ligação'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            cat "$RUNNER_TEMP/ligar.lftp"
            echo 'set cmd:fail-exit no'
            for pasta in . public_html domains domains/artvisao.pt domains/artvisao.pt/public_html; do
              echo "echo \"== $pasta\""
              echo "cls -1F \"$pasta\""
            done
          } > "$RUNNER_TEMP/testar.lftp"
          saida=$(lftp -f "$RUNNER_TEMP/testar.lftp" 2>&1 | head -n 120)
          echo "$saida"
          case "$saida" in
            *"Login failed"*|*"Login incorrect"*|*"530 "*)
              echo "::error::o servidor recusou o utilizador ou a password (confirmar FTP_USERNAME e FTP_PASSWORD)"; exit 1 ;;
            *"ssl-force is set"*)
              echo "::error::o servidor não aceita ligações cifradas (FTPS)"; exit 1 ;;
            *"not known"*|*"Name or service"*|*"No address associated"*|*"host not found"*)
              echo "::error::servidor não encontrado (confirmar FTP_SERVER)"; exit 1 ;;
            *"Connection refused"*|*"timed out"*)
              echo "::error::o servidor não respondeu no FTP (confirmar FTP_SERVER)"; exit 1 ;;
          esac
          # a listagem fica também como anotação no resumo da corrida
          echo "::notice title=Pastas no servidor::$(printf '%s' "$saida" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

      - name: Preparar a cópia de produção
        if: inputs.modo == 'publicar'
        run: cp -r artvisao _prod

      # A última galeria que funcionou — partilhada com a publicação do GitHub Pages
      - name: Recuperar a última galeria do Instagram
        if: inputs.modo == 'publicar'
        uses: actions/cache@v4
        with:
          path: .ig-cache
          key: instagram-${{ github.run_id }}
          restore-keys: instagram-

      - name: Trazer publicações do Instagram
        if: inputs.modo == 'publicar'
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IG_CACHE: .ig-cache
        run: python3 .github/scripts/instagram.py _prod

      # O cd falha se a pasta não existir: nunca se cria por engano um site noutro sítio.
      # O relatório do Instagram fica só na cópia de teste.
      - name: Enviar por FTP
        if: inputs.modo == 'publicar'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          {
            cat "$RUNNER_TEMP/ligar.lftp"
            echo 'set cmd:fail-exit yes'
            echo "cd \"$FTP_DIR\""
            echo 'mirror --reverse --no-perms --parallel=4 --verbose=1 --exclude-glob instagram-estado.txt _prod .'
            if [ -d _prod/assets/instagram ]; then
              echo 'mirror --reverse --delete --no-perms --verbose=1 _prod/assets/instagram assets/instagram'
            fi
          } > "$RUNNER_TEMP/publicar.lftp"
          if lftp -f "$RUNNER_TEMP/publicar.lftp"; then
            echo "::notice title=Publicado::site enviado para $FTP_DIR"
          else
            echo "::error::o envio por FTP falhou (ver o registo deste passo)"
            exit 1
          fi
