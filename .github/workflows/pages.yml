# Publica o site em GitHub Pages a partir da pasta artvisao/.
#
# O Pages só permite escolher a raiz do repositório ou /docs, e o site vive
# noutra pasta — daí um workflow em vez da opção "deploy from a branch".
#
# Publicação de teste, a par de www.artvisao.pt: o preparar-pages.py tira o
# formulário de contacto (depende de PHP, que o Pages não corre) e marca as
# páginas com noindex.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; corridas a meio são canceladas
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar cópia estática
        run: |
          cp -r artvisao _site
          python3 .github/scripts/preparar-pages.py _site

      # A última galeria que funcionou, para o caso de a Meta falhar nesta corrida.
      # A chave muda a cada corrida, por isso guarda sempre a mais recente; o
      # restore-keys vai buscar a última guardada.
      - name: Recuperar a última galeria do Instagram
        uses: actions/cache@v4
        with:
          path: .ig-cache
          key: instagram-${{ github.run_id }}
          restore-keys: instagram-

      # Sem o secret configurado a galeria fica vazia e a publicação segue na mesma.
      # O resultado fica publicado em instagram-estado.txt (sem tokens).
      - name: Trazer publicações do Instagram
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IG_CACHE: .ig-cache
        run: python3 .github/scripts/instagram.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
