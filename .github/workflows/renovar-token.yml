# Mantém vivo o token da Meta que alimenta a galeria do Instagram (ver
# .github/scripts/instagram.py). O token de utilizador dura 60 dias; esta
# Action troca-o por um novo bem antes disso e deriva de novo o token de
# Página, sem precisar de intervenção manual.
name: Renovar token da Meta

on:
  schedule:
    - cron: '0 6 1 * *' # dia 1 de cada mês, dentro da janela de 60 dias
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renovar token de utilizador e token de página
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 .github/scripts/renovar-token.py
